name: Android CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Unit tests need no device; lint and assemble validate the build that
      # can't be verified in the Claude sandbox (no Android SDK there).
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Lint
        run: ./gradlew :app:lint

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports/
          if-no-files-found: ignore

  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::plumber
            any::processx
            any::base64enc
            any::jsonlite
            any::testthat
            any::httr2
            any::withr
            any::webutils

      - name: Run backend integration tests
        run: Rscript backend/run-tests.R

  hardened-egress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bring up the hardened stack
        working-directory: backend
        run: docker compose -f docker-compose.yml -f docker-compose.hardened.yml up -d --build

      - name: Wait for health (via the proxy)
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:8000/health >/dev/null 2>&1 && exit 0
            sleep 2
          done
          echo "backend never became healthy"; exit 1

      - name: Ingress works
        run: curl -s http://localhost:8000/health | grep -q '"status":"ok"'

      - name: Egress is blocked
        run: |
          out=$(curl -s -X POST http://localhost:8000/execute \
            -H 'Content-Type: application/json' \
            -d '{"code":"options(timeout=5); cat(tryCatch({ readLines(url(\"http://example.com\")); \"REACHED\" }, error = function(e) \"BLOCKED\"))"}')
          echo "response: $out"
          echo "$out" | grep -q '"stdout":"BLOCKED"'

      - name: Tear down
        if: always()
        working-directory: backend
        run: docker compose -f docker-compose.yml -f docker-compose.hardened.yml down -v
