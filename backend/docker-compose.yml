services:
  r-execution:
    build: .
    ports:
      - "8000:8000"
    environment:
      R_EXECUTION_TIMEOUT_SECONDS: "20"
      R_MAX_CODE_LENGTH: "20000"
      # Auth + rate limiting are OFF by default for local dev. Set a key and a
      # per-IP/minute cap before exposing this beyond your own machine. The
      # Android app sends the key via its Settings screen (X-API-Key header).
      R_API_KEY: "${R_API_KEY:-}"
      R_RATE_LIMIT_PER_MINUTE: "${R_RATE_LIMIT_PER_MINUTE:-0}"
      R_SESSION_DIR: "/data/sessions"
      R_PKG_LIB: "/data/rlib"
      R_INSTALL_TIMEOUT_SECONDS: "300"
      R_CRAN_REPO: "${R_CRAN_REPO:-https://packagemanager.posit.co/cran/__linux__/jammy/latest}"
    # Defense-in-depth for an inherently risky service (arbitrary code execution).
    # None of this replaces real sandboxing before exposing the service publicly
    # -- see README.md.
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - r_sessions:/data/sessions
      # /data/rlib is now a read-only legacy package source (LEGACY_PKG_LIB);
      # per-session package libraries live under /data/sessions/<id>/rlib.
      - r_rlib:/data/rlib:ro
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Raised above the default because POST /upload buffers the whole multipart
    # body in memory (see R_UPLOAD_MAX_BYTES, default 1 GiB). Lower both together.
    mem_limit: 2g
    cpus: 1.0

volumes:
  r_sessions:
  r_rlib:
