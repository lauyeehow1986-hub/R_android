# Project-wide Gradle settings.

# Run the Gradle daemon with a reasonable heap.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# AndroidX is required by all the androidx.* / Compose dependencies this app uses.
android.useAndroidX=true

# Kotlin code style for the official conventions.
kotlin.code.style=official

# Only build the resources referenced by this project (faster builds).
android.nonTransitiveRClass=true
